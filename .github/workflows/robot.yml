name: robot
on:
  schedule:
    - cron: '23 * * * *'        # toutes les heures (GitHub en saute souvent : le veilleur surveille)
    - cron: '53 13-20 * * 1-5'  # + toutes les 30 min pendant la séance de Wall Street (heure UTC)
  workflow_dispatch:
permissions:
  contents: write
  actions: write   # pour lancer la publication du site (tâche « site », séparée)
concurrency:
  group: robot
  cancel-in-progress: false
# 09/10 : plus d'étape « autorisation de publication » ici. Le 06/10, un passage est resté coincé 2 jours sur
# cette étape et a bloqué tous les suivants. La publication du site est maintenant une tâche à part (site.yml) :
# si elle se coince, le robot continue et la publication suivante remplace celle qui est coincée.
# Briques désignées par leur empreinte exacte (une version piratée plus tard ne pourrait pas s'y glisser).
jobs:
  robot:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: État précédent
        run: git fetch -q --depth=1 origin site && git worktree add -q site FETCH_HEAD || echo "premier passage"
      - name: Fichiers chiffrés de la branche coffre
        run: |
          git fetch -q --depth=1 origin coffre || exit 0
          git show FETCH_HEAD:coffre.enc > coffre.enc 2>/dev/null || rm -f coffre.enc
          git show FETCH_HEAD:abonnements.enc > abonnements.enc 2>/dev/null || rm -f abonnements.enc
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Passage du robot
        run: node robot.mjs
        env:
          MOT_DE_PASSE: ${{ secrets.MOT_DE_PASSE }}
      - name: Mémoriser l'état (branche site, écrasée à chaque passage)
        if: hashFiles('out/data.enc') != ''
        run: |
          cd out
          git init -q -b site
          git add -A
          git -c user.name=robot -c user.email=robot@users.noreply.github.com commit -qm maj
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" site
      - name: Sauvegarde hebdomadaire chiffrée (branche sauvegardes, 8 dernières semaines)
        if: hashFiles('out/historique.enc') != ''
        run: |
          W=$(date -u +%G-S%V)
          mkdir -p sv && cd sv && git init -q -b sauvegardes
          if git fetch -q --depth=1 "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" sauvegardes 2>/dev/null; then git checkout -q FETCH_HEAD -- . ; fi
          if [ -f "$W.enc" ]; then echo "sauvegarde de la semaine déjà faite"; exit 0; fi
          node -e 'const fs=require("fs");const r=f=>fs.existsSync(f)?fs.readFileSync(f,"utf8"):null;fs.writeFileSync(process.argv[1],JSON.stringify({v:1,at:Date.now(),coffre:r("../coffre.enc"),hist:r("../out/historique.enc")}))' "$W.enc"
          ls *.enc | sort | head -n -8 | xargs -r rm -f
          git add -A
          git -c user.name=robot -c user.email=robot@users.noreply.github.com commit -qm sauvegarde
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" sauvegardes
          echo "sauvegarde de la semaine enregistrée"
      - name: Publier le site (tâche séparée)
        if: hashFiles('out/data.enc') != ''
        run: |
          curl -sf -X POST -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/site.yml/dispatches" -d '{"ref":"main"}' && echo "publication lancée" || echo "publication non lancée : le veilleur s'en chargera"
