name: restaurer
# 17/10 : remet l'historique et l'état du robot d'une sauvegarde hebdomadaire (branche sauvegardes) sur la branche site.
# Tes données personnelles (coffre) se restaurent depuis l'appli : Réglages → Sauvegardes.
on:
  workflow_dispatch:
    inputs:
      semaine:
        description: "Semaine à remettre, au format 2026-S42 (voir la liste dans Réglages → Sauvegardes)"
        required: true
permissions:
  contents: write
  actions: write
concurrency:
  group: robot
  cancel-in-progress: false
jobs:
  restaurer:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Remettre la sauvegarde
        env:
          W: ${{ inputs.semaine }}
          U: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          echo "$W" | grep -Eq '^[0-9]{4}-S[0-9]{2}$' || { echo "::error::format attendu : 2026-S42"; exit 1; }
          mkdir sv site && cd sv && git init -q && git fetch -q --depth=1 "$U" sauvegardes && git checkout -q FETCH_HEAD -- "$W.enc"
          cd ../site && git init -q -b site && git fetch -q --depth=1 "$U" site && git checkout -q FETCH_HEAD -- .
          node -e 'const fs=require("fs");const B=JSON.parse(fs.readFileSync("../sv/"+process.env.W+".enc","utf8"));if(!B.hist){console.log("::error::sauvegarde sans historique");process.exit(1)}fs.writeFileSync("historique.enc",B.hist);if(B.data)fs.writeFileSync("data.enc",B.data);console.log("historique remis"+(B.data?" + état du robot":" (cette ancienne sauvegarde ne contenait pas l état du robot)"))'
          git add -A && git -c user.name=robot -c user.email=robot@users.noreply.github.com commit -qm restauration && git push -qf "$U" site
          curl -sf -X POST -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/actions/workflows/site.yml/dispatches" -d '{"ref":"main"}' && echo "publication du site lancée"
